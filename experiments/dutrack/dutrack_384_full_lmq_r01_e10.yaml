  EXTRA_MERGER: false
  HEAD:
    NUM_CHANNELS: 256
    TYPE: CENTER
  PRETRAIN_FILE: DUTrack_Pretrained_384_full.pth.tar
  RETURN_INTER: false
  TE:
    ENABLE: false
