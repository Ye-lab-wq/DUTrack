    SCORE_PRIOR_CENTER: mean
    SCORE_PRIOR_LAYER: 15
    SCORE_PRIOR_MARGIN_TAU: 0.1
    SCORE_PRIOR_EPS: 0.0001
    SCORE_PRIOR_BIAS_CLAMP: 0.35

    AUX_SEARCH_LOSS_WEIGHT: 0.0
