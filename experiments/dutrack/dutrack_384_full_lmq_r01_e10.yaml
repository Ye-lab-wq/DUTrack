    AUX_SCORE_POS_QUALITY: 0.85
    AUX_SCORE_POS_MAX_TOKENS: 2
    AUX_SCORE_POS_MIN_QUALITY: 0.0
    AUX_SCORE_HARD_NEG_RATIO: 0.02
    AUX_SCORE_HARD_NEG_TOPK: 6
    AUX_SCORE_HARD_NEG_MAX_QUALITY: 0.0
    AUX_SCORE_CORRECTIVE_MARGIN: 0.03
    AUX_SCORE_GAIN_MARGIN: 0.003
    AUX_SCORE_GAIN_WEIGHT: 0.02
    AUX_SCORE_BIAS_L2_WEIGHT: 0.002

    AUX_CENTER_SIGMA_SCALE: 0.35
    AUX_CENTER_MIN_SIGMA: 0.04
    AUX_CENTER_BASE_QUALITY: 0.3
TEST:
  EPOCH: 10
  MEMORY_THRESHOLD: 1000
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_NUMBER: 3
  TEMPLATE_SIZE: 192
  LANGUAGE_INIT_SOURCE: dataset_or_class
  LANGUAGE_UPDATE_MODE: anchor
TRAIN:
  AMP: true
  BACKBONE_MULTIPLIER: 1.0
  BATCH_SIZE: 2
  BBOX_TASK: true
  DROP_PATH_RATE: 0.1
  EPOCH: 10
  GIOU_WEIGHT: 2.0
  GRAD_CLIP_NORM: 0.1
  GRAD_ACCUM_STEPS: 4
  L1_WEIGHT: 5.0
  LR: 0.00005
  LR_DROP_EPOCH: 8
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    DECAY_RATE: 0.1
    TYPE: step
  SAVE_LATEST_ONLY: true
  TRAIN_TE_ONLY: true
